# MarsAI ERPNext — Production Docker Compose for Coolify
# Deploy via Coolify as Docker Compose resource
# Domain: erp.marsai.co.uk → frontend:8080
#
# create-site is idempotent: it creates the site on first deploy and runs
# `bench migrate` on every subsequent redeploy — so redeploys are safe and
# apply pending schema patches without data loss. Never re-adds --force.
# Admin password: Coolify env ADMIN_PASSWORD ile yonetiliyor

services:
  # ==================== Frontend (Nginx) ====================
  frontend:
    image: ghcr.io/akif-dogan/erpnext-marsai:v16.28.0-mars28
    restart: unless-stopped
    command: nginx-entrypoint.sh
    environment:
      BACKEND: backend:8000
      FRAPPE_SITE_NAME_HEADER: erp.marsai.co.uk
      SOCKETIO: websocket:9000
      UPSTREAM_REAL_IP_ADDRESS: 127.0.0.1
      UPSTREAM_REAL_IP_HEADER: X-Forwarded-For
      UPSTREAM_REAL_IP_RECURSIVE: "off"
      PROXY_READ_TIMEOUT: 120
      CLIENT_MAX_BODY_SIZE: 50m
    expose:
      - "8080"
    volumes:
      - sites:/home/frappe/frappe-bench/sites
      - logs:/home/frappe/frappe-bench/logs
    depends_on:
      - backend
      - websocket

  # ==================== Backend (Gunicorn) ====================
  backend:
    image: ghcr.io/akif-dogan/erpnext-marsai:v16.28.0-mars28
    restart: unless-stopped
    volumes:
      - sites:/home/frappe/frappe-bench/sites
      - logs:/home/frappe/frappe-bench/logs
    environment:
      DB_HOST: db
      DB_PORT: "3306"
      MYSQL_ROOT_PASSWORD: "${DB_ROOT_PASSWORD}"
      MARIADB_ROOT_PASSWORD: "${DB_ROOT_PASSWORD}"
    depends_on:
      configurator:
        condition: service_completed_successfully

  # ==================== WebSocket (Socket.IO) ====================
  websocket:
    image: ghcr.io/akif-dogan/erpnext-marsai:v16.28.0-mars28
    restart: unless-stopped
    command:
      - node
      - /home/frappe/frappe-bench/apps/frappe/socketio.js
    volumes:
      - sites:/home/frappe/frappe-bench/sites
      - logs:/home/frappe/frappe-bench/logs
    depends_on:
      configurator:
        condition: service_completed_successfully

  # ==================== Scheduler ====================
  scheduler:
    image: ghcr.io/akif-dogan/erpnext-marsai:v16.28.0-mars28
    restart: unless-stopped
    command: bench schedule
    volumes:
      - sites:/home/frappe/frappe-bench/sites
      - logs:/home/frappe/frappe-bench/logs
    depends_on:
      configurator:
        condition: service_completed_successfully

  # ==================== Workers ====================
  queue-short:
    image: ghcr.io/akif-dogan/erpnext-marsai:v16.28.0-mars28
    restart: unless-stopped
    command: bench worker --queue short,default
    volumes:
      - sites:/home/frappe/frappe-bench/sites
      - logs:/home/frappe/frappe-bench/logs
    depends_on:
      configurator:
        condition: service_completed_successfully

  queue-long:
    image: ghcr.io/akif-dogan/erpnext-marsai:v16.28.0-mars28
    restart: unless-stopped
    command: bench worker --queue long,default,short
    volumes:
      - sites:/home/frappe/frappe-bench/sites
      - logs:/home/frappe/frappe-bench/logs
    depends_on:
      configurator:
        condition: service_completed_successfully

  # ==================== Configurator (one-shot) ====================
  configurator:
    image: ghcr.io/akif-dogan/erpnext-marsai:v16.28.0-mars28
    restart: on-failure
    entrypoint:
      - bash
      - -c
    command:
      - >
        ls -1 apps > sites/apps.txt;
        bench set-config -g db_host $$DB_HOST;
        bench set-config -gp db_port $$DB_PORT;
        bench set-config -g redis_cache "redis://$$REDIS_CACHE";
        bench set-config -g redis_queue "redis://$$REDIS_QUEUE";
        bench set-config -g redis_socketio "redis://$$REDIS_QUEUE";
        bench set-config -gp socketio_port $$SOCKETIO_PORT;
    environment:
      DB_HOST: db
      DB_PORT: "3306"
      REDIS_CACHE: redis-cache:6379
      REDIS_QUEUE: redis-queue:6379
      SOCKETIO_PORT: "9000"
    volumes:
      - sites:/home/frappe/frappe-bench/sites
      - logs:/home/frappe/frappe-bench/logs
    depends_on:
      db:
        condition: service_healthy
      redis-cache:
        condition: service_started
      redis-queue:
        condition: service_started

  # ==================== Site Creator / Migrator (idempotent: create on first deploy, migrate on every update) ====================
  # NOT: marsai_platform varlik (asset) sembolik bagi BURADA DEGIL, imajda
  # yaratiliyor (mars28+). Sebep: `sites/assets` volume'un icinde degil,
  # imajdaki /home/frappe/frappe-bench/assets dizinine giden bir bag; calisma
  # aninda oraya yazan container kendi katmanina yazar ve cikinca kaybolur.
  create-site:
    image: ghcr.io/akif-dogan/erpnext-marsai:v16.28.0-mars28
    restart: "no"
    entrypoint:
      - bash
      - -c
    command:
      - >
        wait-for-it -t 120 db:3306;
        wait-for-it -t 120 redis-cache:6379;
        wait-for-it -t 120 redis-queue:6379;
        export start=`date +%s`;
        until [[ -n `grep -hs ^ sites/common_site_config.json | jq -r ".db_host // empty"` ]] && \
          [[ -n `grep -hs ^ sites/common_site_config.json | jq -r ".redis_cache // empty"` ]] && \
          [[ -n `grep -hs ^ sites/common_site_config.json | jq -r ".redis_queue // empty"` ]];
        do
          echo "Waiting for configurator...";
          sleep 5;
          if (( `date +%s`-start > 120 )); then
            echo "Timeout waiting for config";
            exit 1;
          fi
        done;
        if [ -f sites/erp.marsai.co.uk/site_config.json ]; then
          echo "Site exists — migrate + ensure apps...";
          bench --site erp.marsai.co.uk migrate;
          for app in payments telephony helpdesk marsai_platform; do
            bench --site erp.marsai.co.uk list-apps | grep -qw "$$app" || bench --site erp.marsai.co.uk install-app "$$app";
          done;
          bench --site erp.marsai.co.uk migrate;
        else
          echo "Site missing — creating fresh site...";
          bench new-site erp.marsai.co.uk --mariadb-user-host-login-scope='%' --admin-password=${ADMIN_PASSWORD} --db-root-username=root --db-root-password=${DB_ROOT_PASSWORD} --install-app erpnext --install-app payments --install-app telephony --install-app helpdesk --install-app marsai_platform --set-default;
        fi
    volumes:
      - sites:/home/frappe/frappe-bench/sites
      - logs:/home/frappe/frappe-bench/logs
    depends_on:
      configurator:
        condition: service_completed_successfully

  # ==================== Database ====================
  db:
    image: mariadb:10.6
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --skip-character-set-client-handshake
      - --skip-innodb-read-only-compressed
    environment:
      MYSQL_ROOT_PASSWORD: "${DB_ROOT_PASSWORD}"
      MARIADB_ROOT_PASSWORD: "${DB_ROOT_PASSWORD}"
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: mysqladmin ping -h localhost --password=${DB_ROOT_PASSWORD}
      interval: 5s
      timeout: 5s
      retries: 10

  # ==================== Redis ====================
  redis-cache:
    image: redis:7-alpine
    restart: unless-stopped

  redis-queue:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis-queue-data:/data

volumes:
  db-data:
  redis-queue-data:
  sites:
  logs:
