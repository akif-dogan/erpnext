name: Build MarsAI ERPNext image
on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Image tag (or. v16.28.0-mars1)"
        required: true
        default: "v16.28.0-mars1"
  push:
    branches: [marsai-image]
    paths:
      - "docker/apps.json"
      - ".github/workflows/build-marsai-image.yml"

env:
  IMAGE: ghcr.io/akif-dogan/erpnext-marsai

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout marsai-image (apps.json)
        uses: actions/checkout@v4

      - name: Checkout frappe_docker (build context)
        uses: actions/checkout@v4
        with:
          repository: frappe/frappe_docker
          path: frappe_docker

      - name: apps.json -> base64
        id: appsjson
        run: echo "b64=$(base64 -w0 docker/apps.json)" >> "$GITHUB_OUTPUT"

      - name: Resolve tag
        id: tag
        run: echo "tag=${{ github.event.inputs.image_tag || 'v16.28.0-mars1' }}" >> "$GITHUB_OUTPUT"

      - name: GHCR login
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & push (layered custom apps)
        uses: docker/build-push-action@v6
        with:
          context: frappe_docker
          file: frappe_docker/images/layered/Containerfile
          push: true
          tags: ${{ env.IMAGE }}:${{ steps.tag.outputs.tag }}
          build-args: |
            FRAPPE_PATH=https://github.com/frappe/frappe
            FRAPPE_BRANCH=version-16
            APPS_JSON_BASE64=${{ steps.appsjson.outputs.b64 }}
